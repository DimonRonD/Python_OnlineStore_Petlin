<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Список товаров</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
</head>
<body>
  {% include "header.html" %}
    <h1>Список товаров</h1>
    <table>
        {% for category in categoryes %}
            <tr><td align="center"><b>{{ category.category_name }}</b></td></tr>
            <tr><td>
            {% for good in category.goods.all %}
                <table width="100%">
                    <tr><td width="70%">
                        <a href="{{ good.goods_id }}/">{{ good.goods_name }}</a>
                    </td><td width="30%">{{ good.goods_price }}</td>
                </tr></table>
            {% endfor %}
            </td></tr>
        {% endfor %}
    </table>
</body>
</html>
